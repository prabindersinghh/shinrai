facts:
  - id: kb_asi_motor_vehicles
    text: "Motor vehicles, trailers and semi-trailers accounted for 8.07% of manufacturing GVA and 6.84% of persons engaged in ASI 2022-23."
    source: src_asi_2223
  - id: kb_asi_food
    text: "Food products accounted for 11.44% of persons engaged in manufacturing and 15.99% of factories in ASI 2022-23."
    source: src_asi_2223
