facts:
  - id: kb_asi_top5_gva
    text: "In ASI 2022-23 the top five states by manufacturing GVA were Maharashtra (16.33%), Gujarat (14.78%), Tamil Nadu (10.33%), Karnataka (7.04%) and Uttar Pradesh (6.09%)."
    source: src_asi_2223
  - id: kb_asi_top5_emp
    text: "In ASI 2022-23 the top five states by persons engaged in manufacturing were Tamil Nadu (15.00%), Maharashtra (12.84%), Gujarat (12.62%), Uttar Pradesh (8.04%) and Karnataka (6.58%)."
    source: src_asi_2223
  - id: kb_jp_total_2024
    text: "As of October 2024 there were 1,434 Japanese companies in India, 35 more than in 2023, after a peak of 1,455 in 2020."
    source: src_jetro_2024_total
  - id: kb_jp_states_2021
    text: "As of October 2021 Japanese companies by state were Haryana 404, Maharashtra 238, Karnataka 226, Tamil Nadu 191 and Delhi 150."
    source: src_jetro_2021_states
  - id: kb_fdi_h1fy25
    text: "For April-September 2024, DPIIT reported FDI equity inflows of US$13,551 million for Maharashtra, US$3,949 million for Gujarat, US$3,542 million for Karnataka, US$1,623 million for Tamil Nadu and US$1,313 million for Haryana."
    source: src_fdi_h1fy25
